server:
  port: 3000
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      cookie:
        name: __Host-tpi-session
        http-only: true
        secure: true
        same-site: strict
        path: /

spring:
  application:
    name: tpi-backend-bff
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: tpi:session
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

# En la arquitectura de la lámina, el BFF consume los servicios ÚNICAMENTE a través del Backend API Gateway
services:
  users-url: ${BACKEND_GATEWAY_URL:http://backend-gateway:8080}
  products-url: ${BACKEND_GATEWAY_URL:http://backend-gateway:8080}

app:
  demo-auth:
    email: ${DEMO_LOGIN_EMAIL:}
    password: ${DEMO_LOGIN_PASSWORD:}
